<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Mode - CrowdCity AI</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.5">
  <link rel="stylesheet" href="css/components.css?v=3.1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: var(--bg-app);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .error-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>

  <div class="error-card">
    <i class="fa-solid fa-wifi" style="font-size: 3rem; color: #f59e0b; margin-bottom: 1rem;"></i>
    <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin: 0 0 0.75rem 0;">You are Offline</h1>
    <p style="font-size: 0.9rem; color: var(--text-muted); margin: 0 0 1.75rem 0; line-height: 1.5;">
      Your internet connection appears to be disconnected. You can still access saved documents and local form drafts.
    </p>

    <div style="display: flex; gap: 0.75rem; justify-content: center;">
      <button onclick="window.location.reload()" class="btn btn-primary" style="padding: 0.65rem 1.4rem; font-weight: 800; border-radius: 10px;">
        <i class="fa-solid fa-rotate"></i> Reconnect
      </button>
    </div>
  </div>

</body>
</html>

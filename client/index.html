<!DOCTYPE html>
<html lang="en">
<head>
  <!-- PWA Meta and Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <meta name="theme-color" content="#0D9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CrowdCity">
  <script src="js/pwa-helper.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrowdCity AI - Loading...</title>
  
  <!-- Central Authentication Router -->
  <script src="js/auth-router.js?v=3.1.0"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>

  <style>
    html, body {
      background-color: #000000;
      color: #ffffff;
      font-family: "Inter", "Noto Sans Tamil", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    html.light-theme, html.light-theme body,
    html[data-theme="light"], html[data-theme="light"] body {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    html.dark-theme, html.dark-theme body,
    html[data-theme="dark"], html[data-theme="dark"] body {
      background-color: #000000 !important;
      color: #ffffff !important;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
      display: none !important;
    }
    .loader {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(13, 148, 136, 0.2);
      border-radius: 50%;
      border-top-color: #0d9488;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p data-i18n="redirecting_to_dashboard">Redirecting to your dashboard...</p>
  </div>
</body>
</html>

  <!-- Early Theme & Language Synchronous Bootstrap (Prevents any FOUC / flicker) -->
  <script>
    (function() {
      var p = (window.location.pathname || '').toLowerCase().replace(/\\/g, '/');
      var f = p.split('/').pop().replace(/\.html$/, '');
      var isAuth = (f === 'auth' || f === 'authority-login' || f === 'reset-password' || f === 'login' || f === 'signup' || f === 'forgot-password');
      var isAuthority = (f.indexOf('authority-') === 0 || f === 'admin' || f === 'services-admin');
      
      var theme = 'light';
      if (!isAuth) {
        try {
          var t = localStorage.getItem('crowdcity_theme') || localStorage.getItem('cc_theme');
          if (t === 'dark') theme = 'dark';
        } catch(e) {}
      }
      var isDark = (theme === 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('dark-theme', isDark);
      document.documentElement.classList.toggle('theme-dark', isDark);
      document.documentElement.classList.toggle('light-theme', !isDark);
      document.documentElement.classList.toggle('theme-light', !isDark);

      var lang = 'en';
      if (!isAuthority && !isAuth) {
        try {
          var l = localStorage.getItem('crowdcity_citizen_language') || localStorage.getItem('crowdcity_language') || localStorage.getItem('cc_lang') || localStorage.getItem('preferred_language');
          lang = (l === 'en' || l === 'ta') ? l : 'ta';
        } catch(e) { lang = 'ta'; }
      } else if (isAuth) {
        try {
          var al = sessionStorage.getItem('cc_auth_display_lang');
          lang = (al === 'ta') ? 'ta' : 'en';
        } catch(e) { lang = 'en'; }
      }
      document.documentElement.lang = lang;
      document.documentElement.setAttribute('data-lang', lang);
      document.documentElement.classList.remove('lang-en', 'lang-ta');
      document.documentElement.classList.add(lang === 'ta' ? 'lang-ta' : 'lang-en');
    })();
  </script>

    /* Clean, non-blocking page rendering */

    .map-layout {

      position: relative;

    @media (min-width: 900px) {

        grid-template-columns: 420px 1fr;

    @media (max-width: 899px) {
      .map-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 320px 1fr;
      }
      .map-viewport {
        grid-row: 1;
        height: 320px;
      }
      .map-sidebar {
        grid-row: 2;
        border-right: none;
        border-top: 1px solid var(--border-color);
        height: 100%;
      }

    .map-sidebar {
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);

      height: 100%;
      overflow-y: auto;

      padding: 1.5rem;
      gap: 1.5rem;
    }

    .map-viewport {
      width: 100%;
      height: 100%;
      background-color: var(--slate-200);
      z-index: 1;
    }

    /* Custom Leaflet overrides */
    .leaflet-bar {
      border: 1px solid var(--border-color) !important;
      box-shadow: var(--shadow-md) !important;
    }
    .leaflet-bar a {

      border-bottom: 1px solid var(--border-color) !important;
    }
    .leaflet-bar a:hover {

    }
  </style>

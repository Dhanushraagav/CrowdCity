<!DOCTYPE html>
<html lang="en">
<head>
  <!-- PWA Meta and Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <meta name="theme-color" content="#0D9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CrowdCity">
  <script src="js/pwa-helper.js" defer></script>
  <!-- Central Authentication Router -->
  <script src="js/auth-router.js?v=1.0.6"></script>
  <script src="js/i18n.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View and track all civic issues you have reported to CrowdCity AI. Monitor live progress, inspector assignments, and resolution proofs.">
  <title>My Complaints - CrowdCity AI</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css?v=1.0.5">
  <link rel="stylesheet" href="css/components.css">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Clean, non-blocking page rendering */
    body {
      opacity: 1;
    }

    .my-complaints-container {
      max-width: 100%;
      width: 100%;
      margin: 0;
      padding: 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
  </style>
</head>
<body>

  <script>
    (function() {
      document.documentElement.classList.add('light-theme');
      document.documentElement.classList.remove('dark-theme');
    })();
  </script>

  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="citizen-dashboard.html" class="app-sidebar-logo">
          <div class="brand-emblems-wrap">
            <img src="images/crowdcity_icon_transparent.png" alt="CrowdCity" class="brand-emblem" />
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Emblem_of_Tamil_Nadu.svg" alt="TN Emblem" class="brand-emblem-tn" />
          </div>
          <div class="brand-text-container">
            <span class="brand-title">CROWDCITY</span>
            <span class="brand-subtitle">CITIZEN PORTAL</span>
          </div>
        </a>
      </div>

      <div class="sidebar-divider"></div>

      <nav class="app-sidebar-nav">
        <a href="citizen-dashboard.html" class="app-sidebar-link" title="Dashboard">
          <i class="fa-solid fa-gauge-high"></i> <span data-i18n="nav_dashboard">Dashboard</span>
        </a>
        <a href="report.html" class="app-sidebar-link" title="Report Issue">
          <i class="fa-solid fa-circle-exclamation"></i> <span data-i18n="nav_report">Report Issue</span>
        </a>
        <a href="my-complaints.html" class="app-sidebar-link active" title="My Complaints">
          <i class="fa-solid fa-clipboard-check"></i> <span data-i18n="nav_my_complaints">My Complaints</span>
        </a>
        <a href="map.html" class="app-sidebar-link" title="Map">
          <i class="fa-solid fa-map-location-dot"></i> <span data-i18n="nav_map">Map</span>
        </a>
        <a href="transportation.html" class="app-sidebar-link" title="Transportation">
          <i class="fa-solid fa-bus-simple"></i> <span data-i18n="nav_transportation">Transportation</span>
        </a>
        <a href="services.html" class="app-sidebar-link" title="Government Services">
          <i class="fa-solid fa-building-columns"></i> <span data-i18n="nav_services">Government Services</span>
        </a>
        <a href="emergency-services.html" class="app-sidebar-link emergency-sidebar-link" title="Emergency Help Center">
          <i class="fa-solid fa-truck-medical"></i> <span data-i18n="emergency_help_center">Emergency Help Center</span>
        </a>
        <a href="helplines.html" class="app-sidebar-link" title="District Helplines">
          <i class="fa-solid fa-headset"></i> <span data-i18n="district_helplines">District Helplines</span>
        </a>
        <a href="analytics.html" class="app-sidebar-link" title="Analytics & Insights">
          <i class="fa-solid fa-chart-line"></i> <span data-i18n="nav_analytics">Analytics & Insights</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <div class="app-main">
      <!-- Top Header inside main content -->
      <header class="app-header-main">
        <a href="citizen-dashboard.html" class="app-header-logo-mobile"><img src="images/crowdcity_icon_transparent.png" alt="CrowdCity" style="width: 26px; height: 26px; object-fit: contain; margin-right: 0.5rem;" /> CrowdCity AI</a>

        <button class="mobile-menu-toggle" id="mobile-menu-btn" aria-label="Toggle Navigation Menu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="app-header-actions">
          <div id="auth-nav-container">
            <!-- Dynamic header actions populated by auth.js -->
          </div>
        </div>
      </header>

      <div class="app-content-body" style="width: 100%; max-width: 100%; padding: 1rem 2rem 3rem 2rem; box-sizing: border-box;">
        <div class="my-complaints-container" style="width: 100%; max-width: 100%; margin: 0; padding: 0 0 3rem 0; display: flex; flex-direction: column; gap: 1.5rem;">

      <!-- Page Header & Tab Switcher -->
      <div style="display: flex; flex-direction: column; gap: 1.25rem; margin-bottom: 0.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin: 0;" data-i18n="my_tracked_cases">My Tracked Cases</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0.25rem 0 0 0;" data-i18n="my_tracked_cases_desc">Monitor the lifecycles, statuses, and details of all issues you submitted.</p>
          </div>
          <a href="report.html" class="btn btn-primary" style="font-size: 0.85rem; padding: 0.6rem 1.2rem;" data-i18n="file_another">
            File Another
          </a>
        </div>

        <!-- Segmented Tab Switcher (Civic vs. Transportation) -->
        <div style="display: flex; gap: 0.5rem; background: var(--bg-surface-hover, #f1f5f9); padding: 0.35rem; border-radius: 12px; width: fit-content; border: 1px solid var(--border-color, #cbd5e1); align-self: flex-start;">
          <button type="button" id="tab-btn-civic" onclick="switchComplaintsTab('civic')" class="btn" style="padding: 0.55rem 1.35rem; font-size: 0.88rem; font-weight: 700; border-radius: 8px; background: var(--primary, #0d9488); color: #ffffff; border: none; cursor: pointer; transition: all 0.2s ease;">
            Civic Complaints
          </button>
          <button type="button" id="tab-btn-transportation" onclick="switchComplaintsTab('transportation')" class="btn" style="padding: 0.55rem 1.35rem; font-size: 0.88rem; font-weight: 700; border-radius: 8px; background: transparent; color: var(--text-muted, #64748b); border: none; cursor: pointer; transition: all 0.2s ease;">
            Transportation Complaints
          </button>
        </div>
      </div>

      <!-- Filters Bar -->
      <div class="glass-panel" style="padding: 1rem; display: flex; flex-direction: column; gap: 1rem; box-shadow: var(--shadow-sm);">
        <!-- Category & Status row -->
        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 150px;">
            <select id="my-cat-filter" class="form-select" style="margin: 0; font-size: 0.88rem; min-height: 42px; padding: 0.5rem 2.25rem 0.5rem 0.95rem; line-height: 1.4; font-weight: 600;">
              <option value="" data-i18n="all_categories">All Categories</option>
              <option value="roads" data-i18n="cat_roads">Roads</option>
              <option value="streetlights" data-i18n="cat_streetlights">Streetlights</option>
              <option value="water_supply" data-i18n="cat_water_supply">Water Supply</option>
              <option value="drainage" data-i18n="cat_drainage">Drainage</option>
              <option value="garbage" data-i18n="cat_garbage">Garbage</option>
              <option value="traffic" data-i18n="cat_traffic">Traffic</option>
              <option value="public_property" data-i18n="cat_public_property">Public Property</option>
              <option value="parks" data-i18n="cat_parks">Parks</option>
              <option value="sanitation" data-i18n="cat_sanitation">Sanitation</option>
              <option value="safety_hazard" data-i18n="cat_safety_hazard">Safety Hazard</option>
              <option value="environment" data-i18n="cat_environment">Environment</option>
              <option value="other" data-i18n="cat_other">Other</option>
            </select>
          </div>
          <div style="flex: 1; min-width: 150px;">
            <select id="my-status-filter" class="form-select" style="margin: 0; font-size: 0.88rem; min-height: 42px; padding: 0.5rem 2.25rem 0.5rem 0.95rem; line-height: 1.4; font-weight: 600;">
              <option value="" data-i18n="all_statuses">All Statuses</option>
              <option value="pending" data-i18n="pending">Pending</option>
              <option value="assigned" data-i18n="assigned">Assigned</option>
              <option value="in_progress" data-i18n="in_progress">In Progress</option>
              <option value="resolved" data-i18n="resolved">Resolved</option>
              <option value="rejected" data-i18n="rejected">Rejected</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Personal Feed List -->
      <div style="display:flex; flex-direction:column; gap:1.25rem; margin-top: 0.5rem;" id="my-issues-list">
        <!-- Loading skeletons -->
        <div class="issue-card" style="cursor: default; pointer-events: none; display: flex; flex-direction: column; gap: 12px; padding: 1.25rem; border: 1px solid var(--border-color);">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="skeleton" style="width: 80px; height: 1.25rem; border-radius: var(--radius-sm);"></div>
            <div class="skeleton" style="width: 70px; height: 1.25rem; border-radius: var(--radius-sm);"></div>
          </div>
          <div class="skeleton" style="width: 50%; height: 1.2rem; border-radius: var(--radius-sm); margin-top: 4px;"></div>
          <div class="skeleton" style="width: 90%; height: 0.8rem; border-radius: var(--radius-sm);"></div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="skeleton" style="width: 12px; height: 12px; border-radius: var(--radius-round);"></div>
            <div class="skeleton" style="width: 150px; height: 0.75rem; border-radius: var(--radius-sm);"></div>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 12px;">
            <div class="skeleton" style="width: 100px; height: 0.75rem; border-radius: var(--radius-sm);"></div>
            <div style="display: flex; gap: 8px;">
              <div class="skeleton" style="width: 50px; height: 1.5rem; border-radius: var(--radius-sm);"></div>
              <div class="skeleton" style="width: 110px; height: 1.5rem; border-radius: var(--radius-sm);"></div>
            </div>
          </div>
        </div>
        <div class="issue-card" style="cursor: default; pointer-events: none; display: flex; flex-direction: column; gap: 12px; padding: 1.25rem; border: 1px solid var(--border-color);">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="skeleton" style="width: 90px; height: 1.25rem; border-radius: var(--radius-sm);"></div>
            <div class="skeleton" style="width: 60px; height: 1.25rem; border-radius: var(--radius-sm);"></div>
          </div>
          <div class="skeleton" style="width: 45%; height: 1.2rem; border-radius: var(--radius-sm); margin-top: 4px;"></div>
          <div class="skeleton" style="width: 85%; height: 0.8rem; border-radius: var(--radius-sm);"></div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="skeleton" style="width: 12px; height: 12px; border-radius: var(--radius-round);"></div>
            <div class="skeleton" style="width: 130px; height: 0.75rem; border-radius: var(--radius-sm);"></div>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 12px;">
            <div class="skeleton" style="width: 90px; height: 0.75rem; border-radius: var(--radius-sm);"></div>
            <div style="display: flex; gap: 8px;">
              <div class="skeleton" style="width: 50px; height: 1.5rem; border-radius: var(--radius-sm);"></div>
              <div class="skeleton" style="width: 110px; height: 1.5rem; border-radius: var(--radius-sm);"></div>
            </div>
          </div>
        </div>
      </div>

        </div>
      </div>
      <!-- Footer Removed -->
    </div>
  </div>

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Client Script files -->
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/my-complaints.js"></script>
  <script src="js/chat-widget.js"></script>

</body>
</html>

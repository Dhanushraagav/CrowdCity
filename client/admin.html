<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Early Theme & Language Synchronous Bootstrap (Prevents any FOUC / flicker) -->
  <script>
    (function() {
      var p = (window.location.pathname || '').toLowerCase().replace(/\\/g, '/');
      var f = p.split('/').pop().replace(/\.html$/, '');
      var isAuth = (f === 'auth' || f === 'authority-login' || f === 'reset-password' || f === 'login' || f === 'signup' || f === 'forgot-password');
      var isAuthority = (f.indexOf('authority-') === 0 || f === 'admin' || f === 'services-admin');
      
      var theme = 'light';
      if (!isAuth) {
        try {
          var t = localStorage.getItem('crowdcity_theme') || localStorage.getItem('cc_theme');
          if (t === 'dark') theme = 'dark';
        } catch(e) {}
      }
      var isDark = (theme === 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('dark-theme', isDark);
      document.documentElement.classList.toggle('theme-dark', isDark);
      document.documentElement.classList.toggle('light-theme', !isDark);
      document.documentElement.classList.toggle('theme-light', !isDark);

      var lang = 'en';
      if (!isAuthority && !isAuth) {
        try {
          var l = localStorage.getItem('crowdcity_citizen_language') || localStorage.getItem('crowdcity_language') || localStorage.getItem('cc_lang') || localStorage.getItem('preferred_language');
          lang = (l === 'en' || l === 'ta') ? l : 'ta';
        } catch(e) { lang = 'ta'; }
      } else if (isAuth) {
        try {
          var al = sessionStorage.getItem('cc_auth_display_lang');
          lang = (al === 'ta') ? 'ta' : 'en';
        } catch(e) { lang = 'en'; }
      }
      document.documentElement.lang = lang;
      document.documentElement.setAttribute('data-lang', lang);
      document.documentElement.classList.remove('lang-en', 'lang-ta');
      document.documentElement.classList.add(lang === 'ta' ? 'lang-ta' : 'lang-en');
    })();
  </script>

  <meta charset="UTF-8">
  <title>Redirecting to Authority Portal...</title>
  <script>
    (function() {
      const hash = window.location.hash.replace('#', '') || '';
      const search = window.location.search || '';

      if (hash.startsWith('details?id=')) {
        const id = hash.split('details?id=')[1];
        window.location.href = 'authority-case-details.html?id=' + encodeURIComponent(id);
      } else if (hash === 'complaints') {
        window.location.href = 'authority-complaints.html' + search;
      } else if (hash === 'assigned') {
        window.location.href = 'authority-assigned.html' + search;
      } else if (hash === 'reports') {
        window.location.href = 'authority-reports.html' + search;
      } else if (hash === 'notifications') {
        window.location.href = 'authority-notifications.html' + search;
      } else if (hash === 'profile') {
        window.location.href = 'authority-profile.html' + search;
      } else if (hash === 'civic-intelligence' || hash === 'intelligence') {
        window.location.href = 'authority-civic-intelligence.html' + search;
      } else {
        window.location.href = 'authority-dashboard.html' + search + window.location.hash;
      }
    })();
  </script>
  <script src="js/theme.js"></script>
</head>
<body>
  <p>Redirecting to CrowdCity AI Authority Portal...</p>
</body>
</html>

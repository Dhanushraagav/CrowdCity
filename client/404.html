<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Early Theme & Language Synchronous Bootstrap (Prevents any FOUC / flicker) -->
  <script>
    (function() {
      var p = (window.location.pathname || '').toLowerCase().replace(/\\/g, '/');
      var f = p.split('/').pop().replace(/\.html$/, '');
      var isAuth = (f === 'auth' || f === 'authority-login' || f === 'reset-password' || f === 'login' || f === 'signup' || f === 'forgot-password');
      var isAuthority = (f.indexOf('authority-') === 0 || f === 'admin' || f === 'services-admin');
      
      var theme = 'light';
      if (!isAuth) {
        try {
          var t = localStorage.getItem('crowdcity_theme') || localStorage.getItem('cc_theme');
          if (t === 'dark') theme = 'dark';
        } catch(e) {}
      }
      var isDark = (theme === 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('dark-theme', isDark);
      document.documentElement.classList.toggle('theme-dark', isDark);
      document.documentElement.classList.toggle('light-theme', !isDark);
      document.documentElement.classList.toggle('theme-light', !isDark);

      var lang = 'en';
      if (!isAuthority && !isAuth) {
        try {
          var l = localStorage.getItem('crowdcity_citizen_language') || localStorage.getItem('crowdcity_language') || localStorage.getItem('cc_lang') || localStorage.getItem('preferred_language');
          lang = (l === 'en' || l === 'ta') ? l : 'ta';
        } catch(e) { lang = 'ta'; }
      } else if (isAuth) {
        try {
          var al = sessionStorage.getItem('cc_auth_display_lang');
          lang = (al === 'ta') ? 'ta' : 'en';
        } catch(e) { lang = 'en'; }
      }
      document.documentElement.lang = lang;
      document.documentElement.setAttribute('data-lang', lang);
      document.documentElement.classList.remove('lang-en', 'lang-ta');
      document.documentElement.classList.add(lang === 'ta' ? 'lang-ta' : 'lang-en');
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Premium Fonts - Inter & Noto Sans Tamil -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=1.0.5">
  <link rel="stylesheet" href="css/components.css?v=3.1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: var(--bg-app);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: var(--font-sans);
    }
    .error-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
    }
  </style>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
</head>
<body>

  <div class="error-card">
    <div style="font-size: 3.5rem; font-weight: 800; color: var(--primary); margin-bottom: 0.5rem;">404</div>
    <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin: 0 0 0.75rem 0;" data-i18n="page_not_found_title">Page Not Found</h1>
    <p style="font-size: 0.9rem; color: var(--text-muted); margin: 0 0 1.75rem 0; line-height: 1.5;" data-i18n="page_not_found_desc">The page or government service link you are looking for may have been moved, renamed, or is temporarily unavailable.</p>

    <div style="display: flex; gap: 0.75rem; justify-content: center;">
      <a href="services.html" class="btn btn-secondary" style="padding: 0.65rem 1.2rem; font-weight: 700; border-radius: 10px; text-decoration: none;">
        <span data-i18n="nav_services">Govt Services</span>
      </a>
      <a href="citizen-dashboard.html" class="btn btn-primary" style="padding: 0.65rem 1.4rem; font-weight: 800; border-radius: 10px; text-decoration: none;">
        <span data-i18n="back_to_dashboard">Return to Dashboard</span>
      </a>
    </div>
  </div>

</body>
</html>

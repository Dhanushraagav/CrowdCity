<!DOCTYPE html>
<html lang="en">
<head>
  <!-- PWA Meta & Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <meta name="theme-color" content="#0D9488" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="My Transportation Cases & Issue Tracking Console - CrowdCity AI" />
  <title>My Transportation Cases - CrowdCity AI</title>

  <!-- Central Authentication Router & Forwarder -->
  <script>
    window.location.replace('my-complaints.html?tab=transportation');
  </script>
  <script src="js/auth-router.js"></script>
  <script src="js/i18n.js"></script>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- App Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />

  <style>
    .trans-filter-bar {
      background: var(--bg-surface, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: var(--radius-lg, 16px);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.85rem;
    }

    .filter-grid select,
    .filter-grid input {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border-color, #cbd5e1);
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--bg-surface);
      color: var(--text-main);
    }

    .trans-table-card {
      background: var(--bg-surface, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: var(--radius-lg, 16px);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .trans-table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .trans-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    .trans-table th {
      background: var(--bg-surface-hover, #f8fafc);
      color: var(--text-muted, #64748b);
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color, #e2e8f0);
    }

    .trans-table td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color, #f1f5f9);
      color: var(--text-main, #0f172a);
      vertical-align: middle;
    }

    .trans-table tbody tr:hover {
      background: var(--bg-surface-hover, #f8fafc);
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-submitted { background: rgba(59, 130, 246, 0.15); color: #2563eb; }
    .status-assigned { background: rgba(245, 158, 11, 0.15); color: #d97706; }
    .status-progress { background: rgba(99, 102, 241, 0.15); color: #4f46e5; }
    .status-resolved { background: rgba(16, 185, 129, 0.15); color: #059669; }
    .status-closed { background: rgba(100, 116, 139, 0.15); color: #475569; }

    .prio-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .prio-critical { background: #ef4444; color: #fff; }
    .prio-high { background: #f97316; color: #fff; }
    .prio-medium { background: #f59e0b; color: #fff; }
    .prio-low { background: #10b981; color: #fff; }
  </style>
</head>
<body class="app-layout">

  <!-- Container for injected sidebar & header -->
  <div id="app-wrapper">
    <div class="app-content">
      <main class="app-main-content" style="padding: 1.5rem;">

        <!-- Page Header -->
        <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-family: var(--font-heading, sans-serif); font-size: 1.6rem; font-weight: 800; color: var(--text-main, #0f172a); margin: 0;">
              <i class="fa-solid fa-list-check" style="color: var(--primary, #0d9488);"></i> My Transportation Cases
            </h1>
            <p style="margin: 0.3rem 0 0 0; color: var(--text-muted, #64748b); font-size: 0.9rem;">
              Track status updates, assigned departments, and resolution photos for your submitted transportation issues.
            </p>
          </div>
          <div style="display: flex; gap: 0.75rem;">
            <a href="transportation-report.html" class="btn btn-primary" style="font-size: 0.85rem;">
              <i class="fa-solid fa-plus"></i> Report New Issue
            </a>
          </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="trans-filter-bar">
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;">
            <div style="flex: 1; min-width: 220px; position: relative;">
              <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem;"></i>
              <input type="text" id="trans-search-input" placeholder="Search by Road Name, Keyword, or Issue ID..." style="width: 100%; padding: 0.6rem 0.85rem 0.6rem 2.2rem; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.88rem; font-family: inherit;" oninput="filterMyReports()" />
            </div>
            <button type="button" onclick="resetFilters()" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.55rem 0.85rem;">
              <i class="fa-solid fa-rotate-left"></i> Reset Filters
            </button>
          </div>

          <div class="filter-grid">
            <div>
              <select id="filter-category" onchange="filterMyReports()">
                <option value="All">All Categories</option>
                <option value="Potholes">Potholes</option>
                <option value="Damaged Roads">Damaged Roads</option>
                <option value="Traffic Signal Not Working">Traffic Signal Not Working</option>
                <option value="Waterlogging">Waterlogging</option>
                <option value="Broken Street Lights">Broken Street Lights</option>
                <option value="Illegal Parking">Illegal Parking</option>
                <option value="Missing Road Signs">Missing Road Signs</option>
                <option value="Bus Stop Issues">Bus Stop Issues</option>
                <option value="Road Block">Road Block</option>
                <option value="Construction Work">Construction Work</option>
                <option value="Accident">Accident</option>
                <option value="Heavy Traffic">Heavy Traffic</option>
              </select>
            </div>

            <div>
              <select id="filter-priority" onchange="filterMyReports()">
                <option value="All">All Priorities</option>
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>

            <div>
              <select id="filter-department" onchange="filterMyReports()">
                <option value="All">All Departments</option>
                <option value="Roads Department">Roads Department</option>
                <option value="Traffic Police">Traffic Police</option>
                <option value="Municipal Corporation">Municipal Corporation</option>
                <option value="Highways Department">Highways Department</option>
                <option value="Street Lighting Department">Street Lighting Department</option>
                <option value="Transport Department">Transport Department</option>
                <option value="Public Works Department">Public Works Department</option>
              </select>
            </div>

            <div>
              <select id="filter-status" onchange="filterMyReports()">
                <option value="All">All Statuses</option>
                <option value="Submitted">Submitted</option>
                <option value="AI Reviewed">AI Reviewed</option>
                <option value="Assigned">Assigned</option>
                <option value="In Progress">In Progress</option>
                <option value="Resolved">Resolved</option>
                <option value="Closed">Closed</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Reports Table -->
        <div class="trans-table-card">
          <div class="trans-table-wrapper">
            <table class="trans-table">
              <thead>
                <tr>
                  <th>Issue ID</th>
                  <th>Title & Road</th>
                  <th>Category</th>
                  <th>Priority</th>
                  <th>Department</th>
                  <th>Status</th>
                  <th>Submitted Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="my-reports-tbody">
                <!-- Dynamic rows -->
                <tr>
                  <td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Loading your transportation cases...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Details Modal -->
        <div id="trans-details-modal" class="modal-overlay" style="display: none;">
          <div class="modal-card" style="max-width: 640px; width: 90%;">
            <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-color); margin-bottom: 1rem;">
              <h3 id="modal-title" style="margin: 0; font-family: var(--font-heading); font-size: 1.15rem; font-weight: 800; color: var(--text-main);">
                Case Details
              </h3>
              <button type="button" onclick="closeDetailsModal()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted);">&times;</button>
            </div>

            <div id="modal-body-content" style="font-size: 0.88rem; display: flex; flex-direction: column; gap: 1rem;">
              <!-- Dynamic modal details -->
            </div>

            <div style="margin-top: 1.5rem; text-align: right;">
              <button type="button" onclick="closeDetailsModal()" class="btn btn-secondary" style="font-size: 0.85rem;">Close</button>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/my-transportation-reports.js"></script>
  <script src="js/chat-widget.js"></script>

</body>
</html>
